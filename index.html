<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Pacarku ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }
        /* Wadah Utama Slideshow ala TikTok */
        .slideshow-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 75vh;
            background: #000;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .mySlides {
            display: none;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .mySlides img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .caption {
            position: absolute;
            bottom: 60px;
            left: 20px;
            right: 20px;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 10px;
        }
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.4);
            color: black;
            font-weight: bold;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            border: none;
            z-index: 10;
        }
        .prev { left: 15px; }
        .next { right: 15px; }
        
        .dot-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .dot {
            height: 4px;
            width: 40px;
            background-color: rgba(255,255,255,0.4);
            border-radius: 2px;
        }
        .active { background-color: #ffffff; }

        /* Tombol Musik Tambahan jika Auto-Play Gagal */
        .music-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #ff477e;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,71,126,0.3);
            z-index: 20;
        }
    </style>
</head>
<body>

<!-- Memakai Relative Path ./ agar pasti terbaca oleh GitHub Pages -->
<audio id="laguRomantis" src="./musik.mp3" loop></audio>

<div class="slideshow-container">
    <div class="dot-container">
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <!-- Jika nama file Anda di GitHub ada huruf besarnya, ganti tulisan di src="..." di bawah ini menyerupai nama di GitHub Anda -->
    <div class="mySlides">
        <img src="./foto1.jpg" alt="Foto 1">
        <div class="caption">-kebetulan aku mahir dalam memotret,amatir dalam menulisadn sedikit lihai dalam menggambar,sayang...</div>
    </div>

    <div class="mySlides">
        <img src="./foto2.jpg" alt="Foto 2">
        <div class="caption">✨ Terima kasih ya sudah bertahan sama aku sampai hari ini! I Love You~</div>
    </div>

    <button class="prev" onclick="plusSlides(-1)">&#10094;</button>
    <button class="next" onclick="plusSlides(1)">&#10095;</button>
</div>

<button class="music-btn" onclick="putarMusik()">🎵 Musik: ON / OFF</button>

<script>
    let slideIndex = 1;
    showSlides(slideIndex);

    function plusSlides(n) {
        showSlides(slideIndex += n);
        putarMusik(); 
    }

    function showSlides(n) {
        let i;
        let slides = document.getElementsByClassName("mySlides");
        let dots = document.getElementsByClassName("dot");
        if (n > slides.length) {slideIndex = 1}    
        if (n < 1) {slideIndex = slides.length}
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";  
        }
        for (i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" active", "");
        }
        slides[slideIndex-1].style.display = "block";  
        dots[slideIndex-1].className += " active";
    }

    function putarMusik() {
        let audio = document.getElementById("laguRomantis");
        if (audio.paused) {
            audio.play().catch(function(error) {
                console.log("Browser memblokir musik otomatis: " + error);
            });
        } else {
            audio.pause();
        }
    }
</script>

</body>
</html>
